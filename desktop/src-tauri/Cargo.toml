[package]
name = "reeta"
version = "1.0.0"
description = "REETA Autonomous Personal AI Operating System"
authors = ["REETA Core Team"]
license = "Proprietary"
edition = "2024"
rust-version = "1.90"
default-run = "REETA"

[[bin]]
name = "REETA"
path = "src/main.rs"

[lib]
name = "reeta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
] }
