services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reeta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reeta_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reeta_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-reeta_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reeta_admin} -d ${POSTGRES_DB:-reeta_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
